{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Informes{% endblock %}</title>
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col transition-colors duration-500">

    <div id="dark-overlay"></div>

    <header class="bg-white dark:bg-gray-800 border-b border-black/10 dark:border-gray-700 shadow-sm transition-colors duration-500">
        <div class="w-full px-4 sm:px-6 py-2 sm:py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 sm:gap-3">
                <img src="{% static 'img/logo_home.png' %}" alt="Logo" class="h-8 sm:h-10 md:h-12 w-auto">
                <div class="flex flex-col">
                    <a href="{% url 'home' %}" class="text-base sm:text-xl md:text-2xl font-bold tracking-tight text-black dark:text-gray-100 hover:text-brand dark:hover:text-brand transition-colors duration-200">Sistema de Informes</a>
                    <span class="text-[10px] sm:text-xs font-medium uppercase text-gray-600 dark:text-gray-400">Portal Corporativo</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button type="button" id="toggle-dark"
                        class="p-2 rounded-full bg-gray-200 dark:bg-gray-700
                               text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600
                               transition duration-200 cursor-pointer">
                    <svg id="icon-sun" class="w-5 h-5 hidden dark:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                    </svg>
                    <svg id="icon-moon" class="w-5 h-5 block dark:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
                <form action="{% url 'logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-sm font-medium text-black dark:text-gray-200 border border-black dark:border-gray-500 rounded-lg px-3 py-1.5 hover:bg-brand hover:text-white hover:border-brand transition-all duration-200 cursor-pointer">Salir</button>
                </form>
            </div>
        </div>
    </header>

    <main class="flex-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white dark:bg-gray-800 border-t border-black/10 dark:border-gray-700 transition-colors duration-500">
        <div class="w-full px-4 py-4 text-center">
            <p class="text-xs text-black dark:text-gray-200">Sistema de Informes &copy; 2026 - Uso Interno</p>
        </div>
    </footer>

    <script src="{% static 'js/base.js' %}"></script>

</body>
</html>
