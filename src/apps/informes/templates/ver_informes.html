{% extends 'base.html' %}
{% load static %}

{% block title %}Ver Informes{% endblock %}

{% block content %}
<div class="w-full max-w-7xl mx-auto mt-4 px-4">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-lg sm:text-xl font-semibold tracking-tight text-black dark:text-gray-100">Informes de Daño</h1>
            <p class="text-sm text-black/50 dark:text-gray-400">Listado de todos los informes registrados</p>
        </div>
        <a href="{% url 'home' %}"
           class="text-sm font-medium text-black dark:text-gray-200 border border-black dark:border-gray-500 rounded-lg px-3 py-1.5 hover:bg-brand hover:text-white hover:border-brand transition-all duration-200">
            Volver
        </a>
    </div>

    <form id="form-filtros" method="get" action="{% url 'lista_informes' %}" class="mb-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input type="text" name="q" id="filtro-q" value="{{ filtros.q }}"
               placeholder="Buscar por cliente, remito o Nº..."
               class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-colors">
        <select name="empleado" id="filtro-empleado"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-colors">
            <option value="">Todos los empleados</option>
            {% for emp in empleados %}
            <option value="{{ emp.id }}" {% if filtros.empleado == emp.id|stringformat:"s" %}selected{% endif %}>
                {{ emp.usuario.get_full_name|title|default:emp.usuario.username }}
            </option>
            {% endfor %}
        </select>
    </form>

    <div class="rounded-lg border border-black/10 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-md transition-colors duration-500 overflow-hidden">
        <div id="tabla-contenedor">
            {% include '_tabla_informes.html' %}
        </div>
    </div>
</div>

<script src="{% static 'js/ver_informes.js' %}"></script>
{% endblock %}
